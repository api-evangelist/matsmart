aid: matsmart
name: Matsmart
description: 'Matsmart (operating internationally as Motatos) is a Swedish e-commerce
  company that fights food waste by selling surplus, short-dated, and overstocked
  groceries and household goods at a discount, with average savings of up to 50%.
  Its catalog spans pantry staples, beverages, snacks, candy, baby food, health and
  beauty, cleaning supplies, pet food, and non-food surplus, sourced from manufacturers
  and retailers and shipped across Sweden and other European markets via partners
  including Bring, Airmee, and PostNord. The company runs a consumer web storefront
  and iOS/Android apps. It was surfaced as a portfolio company of Northzone and added
  to the API Evangelist network; it publishes no public developer API or documentation,
  so this profile captures its public web, security, and identity surface.'
